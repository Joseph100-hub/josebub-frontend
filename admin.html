<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Josebub — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<style>
  .admin-wrap { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
  .key-form { display: flex; gap: 10px; max-width: 420px; margin-bottom: 32px; }
  .key-form input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--cream); }
  .key-form button { background: var(--gold); color: var(--ink); border: none; border-radius: 10px; padding: 0 20px; font-weight: 600; cursor: pointer; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
  .stat-label { color: var(--faint); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 8px; }
  .stat-value { font-family: 'IBM Plex Mono', monospace; font-size: 1.5rem; margin: 0; }
  .stat-value.gold { color: var(--gold); }
  .stat-value.green { color: var(--green-light); }
  .stat-value.coral { color: var(--coral); }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th { text-align: left; color: var(--faint); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.06em; padding: 8px; border-bottom: 1px solid var(--border); }
  td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .table-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 24px; overflow-x: auto; }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <div class="brand"><span class="coin">◐</span> Josebub Admin</div>
  </div>
</header>

<div class="admin-wrap">
  <form id="key-form" class="key-form">
    <input type="password" id="admin-key" placeholder="Admin key" />
    <button type="submit">Load stats</button>
  </form>
  <p id="admin-msg" class="msg"></p>

  <div id="dashboard" class="hidden">
    <div class="stat-grid">
      <div class="stat-card"><p class="stat-label">Users</p><p class="stat-value" id="stat-users">—</p></div>
      <div class="stat-card"><p class="stat-label">Ad views credited</p><p class="stat-value" id="stat-views">—</p></div>
      <div class="stat-card"><p class="stat-label">Paid to users (total)</p><p class="stat-value gold" id="stat-rewarded">—</p></div>
      <div class="stat-card"><p class="stat-label">Withdrawn</p><p class="stat-value" id="stat-withdrawn">—</p></div>
      <div class="stat-card"><p class="stat-label">Pending withdrawals</p><p class="stat-value coral" id="stat-pending">—</p></div>
      <div class="stat-card"><p class="stat-label">Held in wallets</p><p class="stat-value" id="stat-held">—</p></div>
      <div class="stat-card"><p class="stat-label">Est. ad revenue in</p><p class="stat-value" id="stat-revenue">—</p></div>
      <div class="stat-card"><p class="stat-label">Est. margin</p><p class="stat-value green" id="stat-margin">—</p></div>
    </div>

    <div class="table-card">
      <p class="ledger-title">Recent withdrawals</p>
      <table>
        <thead><tr><th>ID</th><th>Phone</th><th>Amount</th><th>Status</th><th>Requested</th></tr></thead>
        <tbody id="withdrawals-body"></tbody>
      </table>
    </div>

    <div class="table-card">
      <p class="ledger-title">Recent signups</p>
      <table>
        <thead><tr><th>ID</th><th>Phone</th><th>Joined</th></tr></thead>
        <tbody id="signups-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
